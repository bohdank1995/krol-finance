<!-- @dsCard group="Semantic" viewport="1000x620" name="Surface" subtitle="Surface, on-surface and outline roles — all aliases of the neutral ramp, live-synced" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<script src="../tokens/token-sync.js"></script>
<style>
body{margin:0;font-family:var(--font-base);background:var(--surface-container-low);color:var(--on-surface)}
.wrap{display:flex;flex-direction:column;gap:22px;padding:26px}
h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-subtle);font-weight:600}
.grid{display:grid;gap:1px;background:var(--outline-variant);border:1px solid var(--outline-variant);border-radius:10px;overflow:hidden}
.g6{grid-template-columns:repeat(6,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.cell{padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;cursor:pointer}
.cell b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.src{display:block;font-size:12px;font-weight:600;opacity:.6;margin-top:4px}
.code{align-self:flex-start;display:flex;flex-direction:column;gap:2px;font-family:monospace;font-size:11px;padding:5px 8px;border-radius:6px;background:rgba(0,0,0,.1)}
.code.copied{background:rgba(0,0,0,.26)}
.code .root{opacity:.7;font-size:10px}
.ol{background:var(--surface-container-lowest)}
.ol .bar{height:34px;border-radius:8px;border:2px solid currentColor}
a{color:var(--primary)}a:hover{color:var(--primary-30)}
</style></head><body>
<div class="wrap">
<section><h3>Surface</h3><div class="grid g6" id="s"></div></section>
<section><h3>On surface</h3><div class="grid g3" id="o"></div></section>
<section><h3>Outline</h3><div class="grid g2" id="l"></div></section>
</div>
<script src="../tokens/palette-editor.js"></script>
<script>
const surf=[['--surface','Surface'],['--surface-container-lowest','Container lowest'],['--surface-container-low','Container low'],['--surface-container','Container'],['--surface-container-high','Container high'],['--surface-container-highest','Container highest']];
const on=[['--on-surface','On surface'],['--on-surface-variant','On surface variant'],['--on-surface-subtle','On surface subtle']];
const ol=[['--outline','Outline'],['--outline-variant','Outline variant']];
const cell=(tok,label,cls,css,inner)=>`<div class="cell ${cls}" style="${css}" data-token="${tok}"><div>${inner||''}<b>${label}</b><span class="src"></span></div><code class="code"><span class="alias">var(${tok})</span><span class="root"></span></code></div>`;
document.getElementById('s').innerHTML=surf.map(([t,l])=>cell(t,l,'',`background:var(${t});color:var(--on-surface)`)).join('');
document.getElementById('o').innerHTML=on.map(([t,l])=>cell(t,l,'',`background:var(${t});color:var(--surface-container-lowest)`)).join('');
document.getElementById('l').innerHTML=ol.map(([t,l])=>cell(t,l,'ol','',`<div class="bar" style="color:var(${t})"></div>`)).join('');
PaletteEditor.onChange(vals=>{
  document.querySelectorAll('.cell').forEach(c=>{
    const [p,step]=PaletteEditor.SEMANTIC[c.dataset.token];
    c.querySelector('.src').textContent=p+' '+step;
    c.querySelector('.root').textContent='--'+p+'-'+step+' // '+vals['--'+p+'-'+step];
  });
});
document.querySelectorAll('.cell').forEach(c=>{
  c.addEventListener('click',()=>{
    const code=c.querySelector('.code'),alias=code.querySelector('.alias'),o=alias.textContent;
    navigator.clipboard.writeText(o).catch(()=>{});
    alias.textContent='Copied!';code.classList.add('copied');
    setTimeout(()=>{alias.textContent=o;code.classList.remove('copied')},1000);
  });
});
</script>
</body></html>
