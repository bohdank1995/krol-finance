<!-- @dsCard group="Semantic" viewport="1000x300" name="Primary" subtitle="Role tokens built from the primary palette — live-synced with the ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<script src="../tokens/token-sync.js"></script>
<style>
  body{margin:0;font-family:var(--font-base)}
  .row{display:flex;height:300px}
  .cell{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:none}
  .cell b{display:block;font-size:22px;font-weight:700;margin-bottom:10px}
  .cell span.src{display:block;font-size:18px;font-weight:600;opacity:0.65}
  .code{align-self:flex-start;display:flex;flex-direction:column;gap:2px;font-family:monospace;font-size:12px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,0.12)}
  .code.copied{background:rgba(0,0,0,0.28)}
  .code .root{opacity:0.7;font-size:11px}
</style></head><body>
<div class="row" id="r"></div>
<script src="../tokens/palette-editor.js"></script>
<script>
const cells=[['--primary','Primary','--on-primary'],['--on-primary','On primary','--neutral-0'],['--primary-container','Primary container','--on-primary-container'],['--on-primary-container','On primary container','--primary-container']];
document.getElementById('r').innerHTML=cells.map(([tok,label,fg])=>`<div class="cell" data-token="${tok}" style="background:var(${tok});color:var(${fg})"><div><b>${label}</b><span class="src"></span></div><code class="code"><span class="alias">var(${tok})</span><span class="root"></span></code></div>`).join('');
PaletteEditor.onChange(vals=>{
  document.querySelectorAll('.cell').forEach(cell=>{
    const [palette,step]=PaletteEditor.SEMANTIC[cell.dataset.token];
    const hex=vals['--'+palette+'-'+step];
    cell.querySelector('.src').textContent=palette+' '+step;
    cell.querySelector('.root').textContent='--'+palette+'-'+step+' // '+hex;
  });
});
document.querySelectorAll('.cell').forEach(cell=>{
  cell.addEventListener('click',()=>{
    const code=cell.querySelector('.code'),alias=code.querySelector('.alias'),original=alias.textContent;
    navigator.clipboard.writeText(original).catch(()=>{});
    alias.textContent='Copied!';code.classList.add('copied');
    setTimeout(()=>{alias.textContent=original;code.classList.remove('copied')},1000);
  });
});
</script>
</body></html>
